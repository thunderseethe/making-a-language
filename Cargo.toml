[workspace]
members = [
  "emit/base",
  "closure_convert/base",
  "lowering/base",
  "lowering/rows",
  "lowering/items",
  "monomorph/base",
  "simplify/base",
  "types/base",
  "types/items",
  "types/rows", 
  "parser/base",
  "desugar/base",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
types-base = { path = "types/base" }
types-rows = { path = "types/rows" }
types-items = { path = "types/items" }
lowering-base = { path = "lowering/base" }
simplify-base = { path = "simplify/base" }
monomorph-base = { path = "monomorph/base" }
closure-convert-base = { path = "closure_convert/base" }
parser-base = { path = "parser/base" }
ena = "0.14.2"
im = "15.1"
pretty_assertions = "1.4"
expect-test = "1.5.1"
pretty = "0.12.3"

[package]
name = "making-a-language"
version = "0.1.0"
edition.workspace = true
