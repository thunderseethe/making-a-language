<html>
  <head>
    <title>Making a Language Playground</title>
    <meta charset="utf-8" />
    <script>
      window.goatcounter = {
        path: function(p) { return location.host + p }
      }
    </script>
    <script data-goatcounter="https://thunderseethe.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </head>
  <body>
    <main id="content">
      <nav>
        <section class="container">
          <a class="navigation-title" href="https://thunderseethe.dev/series/making-a-language" target="_blank">Making a Language Playground</a>
        </section>
        <section class="container" style="display: flex; flex-flow: row-reverse nowrap;">
          <a class="bug-report" href="https://github.com/thunderseethe/making-a-language/issues/new" target="_blank">
            File a Bug
          </a>
        </section>
      </nav>
      <div id="editor"></div>
      <div id="treeTab">
        <tabs aria-label="Tabs to select trees" role="radiogroup" class="around">
          <label class="grow"><input type="radio" name="tree" id="cst-tab" checked><a>Cst</a></label>
          <label class="grow"><input type="radio" name="tree" id="ast-tab"><a>Ast</a></label>
          <label class="grow"><input type="radio" name="tree" id="ir-tab"><a>IR</a></label>
          <label class="grow"><input type="radio" name="tree" id="simple-ir-tab"><a>Simple IR</a></label> 
          <label class="grow"><input type="radio" name="tree" id="wasm-tab"><a>Wasm</a></label>
        </tabs>
        <tab-content>
          <div tabindex="0" id="cst-tab-content" class="tree"></div>
          <div tabindex="0" id="ast-tab-content" class="tree"></div>
          <div tabindex="0" id="ir-tab-content" class="tree"></div>
          <div tabindex="0" id="simple-ir-tab-content" class="tree"></div>
          <div tabindex="0" id="wasm-tab-content" class="tree" style="position: relative;"></div>
        </tab-content>
      </div>
      <div id="repl">
        <tabs>
          <label><input type="radio" name="repl" id="output-tab" checked><a>Output</a></label>
          <label><input type="radio" name="repl" id="log-tab" checked><a>Log</a></label>
        </tabs>
        <tab-content>
          <div tabindex="0" id="output-tab-content"></div>
          <div tabindex="0" id="log-tab-content"></div>
        </tab-content>
      </div>
    </main>
  </body>
</html>
